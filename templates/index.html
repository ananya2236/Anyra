  <style type="text/tailwindcss">
    @layer base {
      body {
        font-family: "Outfit", sans-serif;
      }
      
      ::-webkit-scrollbar{
        display: none;
      }
    }

    @layer utilities {
    @keyframes swirl {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3),
                    0 0 60px rgba(0, 255, 255, 0.2),
                    0 0 100px rgba(255, 0, 255, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 30px rgba(255, 0, 255, 0.5),
                    0 0 80px rgba(0, 200, 255, 0.4),
                    0 0 120px rgba(0, 255, 200, 0.4);
        transform: scale(1.05);
      }
    }

    .swirl-glow {
      background: radial-gradient(circle at center,
        rgba(2, 14, 69, 0.5),
        rgba(38, 59, 136, 0.3),
        rgba(97, 47, 212, 0.3),
        rgba(232, 56, 153, 0.3),
        rgba(77, 47, 129, 0.2)
      );
      background-size: 300% 300%;
      animation:
        swirl 8s ease-in-out infinite,
        pulseGlow 3s ease-in-out infinite;
      border-radius: 9999px;
    }

    /* 👁️ Blinking animation for both eyes */
    @keyframes blink {
      0%, 95%, 100% {
        transform: scaleY(1);
      }
      97% {
        transform: scaleY(0.1); /* Eye closes */
      }
    }

    /* ✨ Eye styling */
    .eye {
      position: absolute;
      width: 15px;
      height: 32px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      animation: blink 5s infinite ease-in-out;
      transform-origin: center;
    }

    /* 👈 Left eye position */
    #eye-left {
      left: 33%;
      top: 40%;
    }

    /* 👉 Right eye position */
    #eye-right {
      right: 33%;
      top: 40%;
    }



    @keyframes blink {
      0%, 94%, 100% { scale: 1; }
      95%, 97% { scale: 1 0.1; }
    }

    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }

    .animate-typewriter {
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      animation: typewriter 1.8s steps(30) forwards;
    }
    @keyframes speakingPulse {
      0%, 100% {
        transform: scale(1) rotateX(0deg) rotateY(0deg);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.7),
                    0 0 50px rgba(255, 0, 255, 0.6),
                    0 0 100px rgba(0, 255, 200, 0.5);
      }
      50% {
        transform: scale(1.15) rotateX(10deg) rotateY(10deg);
        box-shadow: 0 0 40px rgba(255, 0, 255, 0.9),
                    0 0 80px rgba(0, 255, 255, 0.8),
                    0 0 140px rgba(255, 255, 0, 0.7);
      }
    }
/* 
.speaking {
  animation: speakingPulse 5s ease-in-out infinite;
}
#ai-greeting {
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
               0 0 15px rgba(180, 100, 255, 0.8);
} */
@keyframes floatParticles {
  from { transform: translateY(0); opacity: 0.8; }
  to { transform: translateY(-100vh); opacity: 0; }
}

.particle {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  animation: floatParticles 12s linear infinite;
  opacity: 0.9;
}

/* 🎨 Colored particle variants */
.particle-cyan {
  background: rgba(0, 255, 255, 0.9);
  box-shadow: 0 0 12px rgba(0, 255, 255, 0.8),
              0 0 24px rgba(0, 255, 255, 0.6);
}
.particle-pink {
  background: rgba(255, 0, 255, 0.9);
  box-shadow: 0 0 12px rgba(255, 0, 255, 0.8),
              0 0 24px rgba(255, 0, 255, 0.6);
}
.particle-blue {
  background: rgba(0, 128, 255, 0.9);
  box-shadow: 0 0 12px rgba(0, 128, 255, 0.8),
              0 0 24px rgba(0, 128, 255, 0.6);
}
.particle-purple {
  background: rgba(180, 0, 255, 0.9);
  box-shadow: 0 0 12px rgba(180, 0, 255, 0.8),
              0 0 24px rgba(180, 0, 255, 0.6);
}

.nav-link {
  position: relative;
  transition: all 0.3s ease-in-out;
}

.nav-link:hover {
  color: #22d3ee; /* Neon cyan */
  text-shadow: 0 0 8px #22d3ee, 0 0 16px #22d3ee;
}

.nav-link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0;
  height: 2px;
  background-color: #22d3ee;
  box-shadow: 0 0 8px #22d3ee, 0 0 16px #22d3ee;
  transition: width 0.3s ease-in-out;
}

.nav-link:hover::after {
  width: 100%;
}

/* Typewriter effect */
.typewriter {
  overflow: hidden;
  white-space: nowrap;
  display: inline-block;
  animation: typing 3s steps(30, end) forwards;
}


@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

@keyframes blink-caret {
  from, to { border-color: transparent }
  50% { border-color: #22d3ee; }
}

/* Pulsing wave animation */
.speaking::before, 
.speaking::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 100%; height: 100%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(0, 255, 255, 0.5);
  animation: pulseWave 2s infinite ease-out;
}

.speaking::after {
  animation-delay: 1s;
}

@keyframes pulseWave {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
}

/* Keep active link glowing */
.nav-link.active {
  color: #22d3ee;
  text-shadow: 0 0 8px #22d3ee, 0 0 16px #22d3ee;
}

.nav-link.active::after {
  width: 100%;
}

/* Fade effect */
.page-transition {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.page-transition.active {
  opacity: 1;
  transform: translateY(0);
}

/* 🌞 Light Mode Base */
.light {
  background-color: #dbfcfd !important; /* AliceBlue (very light blue) */
  color: black !important;
}

/* Apply black text globally in light mode */
.light * {
  color: black !important;
}


/* Fix bubbles in light mode */
.light #chatContainer div[data-sender="user"] {
  background-color: #dbeafe !important; /* light blue */
  color: black !important;
}
.light #chatContainer div[data-sender="ai"] {
  background-color: #e5e7eb !important; /* light gray */
  color: black !important;
}

/* Modal in light mode */
.light #settingsModal .bg-gray-900 {
  background-color: #f3f4f6 !important; /* light gray */
}
.light #settingsModal input {
  background-color: white !important;
  border-color: #d1d5db !important;
  color: black !important;
}
.light #settingsModal button {
  color: black !important;
}
.light nav a {
  color: #2563eb !important; /* Tailwind blue-600 */
  text-shadow: none !important;
}

/* 🌞 Light mode glowing ball */
.light .swirl-glow {
  background: radial-gradient(circle at center,
    rgba(103, 167, 246, 0.9),   /* bright blue core */
    rgba(164, 101, 241, 0.7),   /* purple glow */
    rgba(240, 125, 240, 0.5),   /* pink outer */
    rgba(86, 86, 232, 0.3)    /* fade into background */
  );
  background-size: 300% 300%;
  animation: swirl 12s ease-in-out infinite, pulseGlow 4s ease-in-out infinite;
  box-shadow: 
    0 0 40px rgba(3, 69, 112, 0.8),
    0 0 80px rgba(51, 7, 132, 0.6),
    0 0 120px rgba(227, 29, 227, 0.5);
}


  }
  </style>

  <script>
function toggleChat() {
  const rightFrame = document.getElementById("rightFrame");
  const main = document.getElementById("mainContainer");
  const leftFrame = document.getElementById("leftFrame");
  const btn = document.getElementById("chatToggleBtn");

  if (window.innerWidth < 1024) {
  // 📱 Mobile → just show/hide below the ball
  rightFrame.classList.toggle("hidden");

  // Optional: scroll down when chat opens
  if (!rightFrame.classList.contains("hidden")) {
    rightFrame.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  return;
}




  // 💻 Laptop → side-by-side toggle
  if (rightFrame.classList.contains("hidden")) {
    main.classList.remove("flex-col", "items-center", "justify-center");
    main.classList.add("flex-row", "items-start");
    leftFrame.classList.add("w-1/2");
    leftFrame.classList.remove("w-full");
    rightFrame.classList.remove("hidden");
    rightFrame.classList.add("w-1/2");

    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.5" stroke="currentColor" class="size-6 text-pink-500 hover:text-pink-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>`;
  } else {
    main.classList.remove("flex-row", "items-start");
    main.classList.add("flex-col", "items-center", "justify-center");
    leftFrame.classList.remove("w-1/2");
    leftFrame.classList.add("w-full");
    rightFrame.classList.add("hidden");
    rightFrame.classList.remove("w-1/2");

    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.5" stroke="currentColor" class="size-6 text-pink-500 hover:text-pink-400">
        <path stroke-linecap="round" stroke-linejoin="round" 
              d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 
                 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 
                 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 
                 48.172 48.172 0 0 0 3.423-.379c1.584-.233 
                 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 
                 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 
                 3.746 2.25 5.14 2.25 6.741v6.018Z" />
      </svg>`;
  }
}


  </script>

<canvas id="particle-bg" class="fixed top-0 left-0 w-full h-full z-[-1]"></canvas>
<script>
const canvas = document.getElementById('particle-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
const particleCount = 80;

for(let i=0;i<particleCount;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2+1,
    dx: (Math.random()-0.5)*1,
    dy: (Math.random()-0.5)*1
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(34,211,238,0.6)';
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

document.getElementById("chatToggleBtn").addEventListener("click", toggleChat);


// --- Dark/Light Mode Toggle ---
const bodyEl = document.getElementById("body");
const themeToggle = document.getElementById("themeToggle");

// Load saved theme
if (localStorage.getItem("theme") === "light") {
  bodyEl.classList.remove("dark");
  bodyEl.classList.add("light");
  themeToggle.textContent = "☀️";
}

themeToggle.addEventListener("click", () => {
  if (bodyEl.classList.contains("dark")) {
    bodyEl.classList.remove("dark");
    bodyEl.classList.add("light");
    themeToggle.textContent = "☀️";
    localStorage.setItem("theme", "light");
  } else {
    bodyEl.classList.remove("light");
    bodyEl.classList.add("dark");
    themeToggle.textContent = "🌙";
    localStorage.setItem("theme", "dark");
  }
});


</script>
